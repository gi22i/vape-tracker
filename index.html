<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Vape Tracker Pro</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --input-bg: #1a1a1a;
            --text-main: #e0e0e0;
            --text-sub: #888888;
            --border: #222222;
            --accent: #4caf50;
            --cig-color: #ff9800;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f2f2f7;
                --card-bg: #ffffff;
                --input-bg: #ffffff;
                --text-main: #000000;
                --text-sub: #666666;
                --border: #d1d1d6;
                --accent: #34c759;
            }
        }

        html { background-color: var(--bg-color); height: 100%; transition: background 0.3s; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; display: block; -webkit-font-smoothing: antialiased; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; padding: env(safe-area-inset-top, 20px) 15px env(safe-area-inset-bottom, 20px) 15px; box-sizing: border-box; }
        
        h1 { text-align: center; margin: 15px 0 25px 0; font-weight: 700; font-size: 2em; letter-spacing: -0.5px; }

        .inputCard, .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-bottom: 20px; box-sizing: border-box; }
        
        label { display: block; font-size: 14px; color: var(--text-sub); margin-left: 4px; margin-bottom: 4px; }
        input { width: 100%; padding: 12px; margin-top: 4px; margin-bottom: 18px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--accent); }

        button { width: 100%; padding: 14px; background: var(--text-main); color: var(--bg-color); border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button:active { opacity: 0.7; }

        #settingsArea { display: none; margin-top: 10px; }
        .settingsToggleBtn { background: var(--border); color: var(--text-main); margin-top: 20px; margin-bottom: 40px; }
        
        .input-group { position: relative; }
        .tick-icon { position: absolute; right: 12px; top: 38px; color: var(--accent); font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        input:not(:placeholder-shown) + .tick-icon { opacity: 1; }

        .date { font-size: 13px; color: var(--text-sub); text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
        .row { display: flex; justify-content: space-between; margin: 6px 0; align-items: center; }
        .total-row { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); font-size: 16px; font-weight: 700; color: var(--accent); display: flex; flex-direction: column; gap: 4px; }
        .cig-equiv { color: var(--cig-color); font-size: 14px; font-weight: 500; }

        .graphLabel { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; display: flex; justify-content: space-between; }
        .graphBar { height: 10px; border-radius: 5px; margin-bottom: 12px; width: 100%; background: var(--border); overflow: hidden; }
        .graphFill { background: var(--accent); height: 100%; transition: width 0.4s ease-out; }

        .deleteBtn { background: transparent; color: #ff3b30; border: 1px solid #ff3b30; margin-top: 15px; font-size: 14px; padding: 8px; width: auto; display: inline-block; }
        .status-msg { text-align: center; color: var(--accent); font-weight: 600; padding: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Vape Tracker</h1>

    <div class="inputCard" id="mainInputCard">
        <div id="morningContainer">
            <label for="morning">Morning Counter</label>
            <input id="morning" type="number" placeholder="Value at start of day">
        </div>
        
        <div id="eveningContainer" style="display:none;">
            <label for="evening">Evening Counter</label>
            <input id="evening" type="number" placeholder="Value at end of day">
        </div>
        
        <div id="completeMsg" style="display:none;" class="status-msg">
            Day Complete! 🎉
            <button id="resetTodayBtn" style="background: var(--border); color: var(--text-main); margin-top: 15px; font-size: 12px; padding: 8px; width: 100%;">Edit Today's Data</button>
        </div>

        <button id="saveBtn">Save Record</button>
    </div>

    <div id="entries"></div>

    <div class="inputCard">
        <div class="graphLabel"><span>Usage Trend (Puffs)</span></div>
        <div id="graph"></div>
    </div>

    <button id="toggleSettings" class="settingsToggleBtn">Settings & Data</button>

    <div id="settingsArea">
        <div class="inputCard">
            <h3>Configuration</h3>
            <label for="juiceStrength">Juice Strength (mg/ml)</label>
            <input id="juiceStrength" type="number" step="0.1">
            
            <label for="dailyGoal">Puff Goal</label>
            <input id="dailyGoal" type="number">

            <div class="input-group">
                <label for="deviceMax">Device Max (Rollover)</label>
                <input id="deviceMax" type="number" placeholder="999 or 9999">
                <span class="tick-icon">✓</span>
            </div>

            <label for="nicPerCig">Nicotine per Cigarette (mg)</label>
            <input id="nicPerCig" type="number" step="0.1" value="1.0">
            <p style="font-size: 11px; color: var(--text-sub); margin-top: -10px;">L&M Red 100s in PL are ~1.0mg.</p>
        </div>

        <div class="inputCard">
            <h3>Data Management</h3>
            <button id="exportJsonBtn" style="margin-bottom: 10px; background: var(--border);">Backup JSON</button>
            <button id="exportCsvBtn" style="margin-bottom: 10px; background: var(--border);">Export CSV</button>
            <input type="file" id="restoreFile" accept=".json" style="display:none;">
            <button id="restoreBtn" style="background: transparent; border: 1px solid var(--border); color: var(--text-sub);">Restore JSON</button>
        </div>
    </div>
</div>

<script>
(() => {
    const AVG_PUFF_ML = 0.005; 
    let entries = [];

    const DOM = {
        juiceStrength: document.getElementById("juiceStrength"),
        dailyGoal: document.getElementById("dailyGoal"),
        deviceMax: document.getElementById("deviceMax"),
        nicPerCig: document.getElementById("nicPerCig"),
        morning: document.getElementById("morning"),
        evening: document.getElementById("evening"),
        morningContainer: document.getElementById("morningContainer"),
        eveningContainer: document.getElementById("eveningContainer"),
        completeMsg: document.getElementById("completeMsg"),
        resetTodayBtn: document.getElementById("resetTodayBtn"),
        entries: document.getElementById("entries"),
        graph: document.getElementById("graph"),
        saveBtn: document.getElementById("saveBtn"),
        toggleSettings: document.getElementById("toggleSettings"),
        settingsArea: document.getElementById("settingsArea"),
        exportJsonBtn: document.getElementById("exportJsonBtn"),
        exportCsvBtn: document.getElementById("exportCsvBtn"),
        restoreFile: document.getElementById("restoreFile"),
        restoreBtn: document.getElementById("restoreBtn")
    };

    function getLogicalDate() {
        const now = new Date();
        // 4 AM Rollover Logic
        if (now.getHours() < 4) {
            now.setDate(now.getDate() - 1);
        }
        return now.toISOString().split("T")[0];
    }

    function loadData() {
        const stored = JSON.parse(localStorage.getItem("vapeEntries") || "[]");
        entries = Array.isArray(stored) ? stored : [];
        entries.sort((a, b) => b.date.localeCompare(a.date));
        
        DOM.juiceStrength.value = localStorage.getItem("cfg_strength") || "20";
        DOM.dailyGoal.value = localStorage.getItem("cfg_goal") || "300";
        DOM.deviceMax.value = localStorage.getItem("cfg_deviceMax") || "9999";
        DOM.nicPerCig.value = localStorage.getItem("cfg_nicPerCig") || "1.0";
        
        updateUI();
    }

    function saveData() {
        localStorage.setItem("vapeEntries", JSON.stringify(entries));
        localStorage.setItem("cfg_strength", DOM.juiceStrength.value);
        localStorage.setItem("cfg_goal", DOM.dailyGoal.value);
        localStorage.setItem("cfg_deviceMax", DOM.deviceMax.value);
        localStorage.setItem("cfg_nicPerCig", DOM.nicPerCig.value);
    }

    function handleSaveEntry() {
        const strength = parseFloat(DOM.juiceStrength.value) || 20;
        const goal = parseInt(DOM.dailyGoal.value) || 300;
        const dMax = parseInt(DOM.deviceMax.value) || 9999;
        const nicCig = parseFloat(DOM.nicPerCig.value) || 1.0;
        const morningVal = parseInt(DOM.morning.value);
        const eveningVal = parseInt(DOM.evening.value);
        const logDate = getLogicalDate();

        if (isNaN(morningVal) && isNaN(eveningVal)) return;

        let existing = entries.find(e => e.date === logDate);
        if (!existing) {
            existing = { date: logDate, goal: goal, juiceStrength: strength, nicPerCig: nicCig };
            entries.unshift(existing);
        }

        if (!isNaN(morningVal)) existing.morning = morningVal;
        if (!isNaN(eveningVal)) existing.evening = eveningVal;

        if (existing.morning !== undefined && existing.evening !== undefined) {
            existing.puffs = (existing.evening < existing.morning) 
                ? (dMax - existing.morning) + existing.evening 
                : existing.evening - existing.morning;
        } else {
            existing.puffs = 0;
        }

        existing.nicotine = +(existing.puffs * strength * AVG_PUFF_ML).toFixed(2);
        saveData();
        updateUI();
        DOM.morning.value = ""; DOM.evening.value = "";
    }

    function updateUI() {
        DOM.entries.innerHTML = "";
        const nicCig = parseFloat(DOM.nicPerCig.value) || 1.0;
        const logDate = getLogicalDate();
        const todaysEntry = entries.find(e => e.date === logDate);

        // Input Visibility Logic
        if (!todaysEntry) {
            DOM.morningContainer.style.display = "block";
            DOM.eveningContainer.style.display = "none";
            DOM.completeMsg.style.display = "none";
            DOM.saveBtn.style.display = "block";
        } else if (todaysEntry.morning !== undefined && todaysEntry.evening === undefined) {
            DOM.morningContainer.style.display = "none";
            DOM.eveningContainer.style.display = "block";
            DOM.completeMsg.style.display = "none";
            DOM.saveBtn.style.display = "block";
        } else {
            DOM.morningContainer.style.display = "none";
            DOM.eveningContainer.style.display = "none";
            DOM.completeMsg.style.display = "block";
            DOM.saveBtn.style.display = "none";
        }

        entries.forEach(e => {
            const cigEquiv = (e.nicotine / nicCig).toFixed(1);
            const card = document.createElement("div");
            card.className = `card ${ (e.morning === undefined || e.evening === undefined) ? 'incomplete' : '' }`;
            card.innerHTML = `
                <div class="date">${new Date(e.date).toLocaleDateString(undefined, {weekday:'short', day:'numeric'})}</div>
                <div class="row"><span>Morn: ${e.morning ?? "-"}</span><span>Eve: ${e.evening ?? "-"}</span></div>
                <div class="total-row">
                    <span>${e.puffs || 0} Puffs • ${e.nicotine || 0}mg Nic</span>
                    <span class="cig-equiv">≈ ${cigEquiv} L&M Red 100s Equiv.</span>
                </div>
            `;
            const del = document.createElement("button");
            del.className = "deleteBtn"; del.textContent = "Delete";
            del.onclick = () => { if(confirm("Delete this day?")) { entries=entries.filter(x=>x.date!==e.date); saveData(); updateUI(); } };
            card.appendChild(del);
            DOM.entries.appendChild(card);
        });

        // Graphing
        DOM.graph.innerHTML = "";
        const last7 = entries.slice(0, 7).reverse();
        const max = Math.max(...last7.map(e => e.puffs || 0), 100);
        last7.forEach(e => {
            const pct = Math.min(((e.puffs || 0) / max) * 100, 100);
            DOM.graph.innerHTML += `
                <div class="graphLabel"><span>${e.date.split('-')[2]}</span><span>${e.puffs || 0}</span></div>
                <div class="graphBar"><div class="graphFill" style="width:${pct}%"></div></div>`;
        });
    }

    DOM.resetTodayBtn.addEventListener("click", () => {
        const logDate = getLogicalDate();
        const todaysEntry = entries.find(e => e.date === logDate);
        if (todaysEntry) {
            DOM.morning.value = todaysEntry.morning;
            DOM.evening.value = todaysEntry.evening || "";
            DOM.completeMsg.style.display = "none";
            DOM.morningContainer.style.display = "block";
            DOM.eveningContainer.style.display = "block";
            DOM.saveBtn.style.display = "block";
        }
    });

    DOM.toggleSettings.addEventListener("click", () => {
        const isVisible = DOM.settingsArea.style.display === "block";
        DOM.settingsArea.style.display = isVisible ? "none" : "block";
        DOM.toggleSettings.textContent = isVisible ? "Settings & Data" : "Close Settings";
    });

    DOM.saveBtn.addEventListener("click", handleSaveEntry);
    DOM.exportJsonBtn.addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries));
        a.download = "vape_tracker_backup.json"; a.click();
    });
    DOM.restoreBtn.addEventListener("click", () => DOM.restoreFile.click());
    DOM.restoreFile.addEventListener("change", (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => { entries = JSON.parse(ev.target.result); saveData(); updateUI(); alert("Data Restored!"); };
        reader.readAsText(e.target.files[0]);
    });

    document.addEventListener("DOMContentLoaded", loadData);
})();
</script>
</body>
</html>
