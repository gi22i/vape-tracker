<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Vape Tracker Pro</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --input-bg: #1a1a1a;
            --text-main: #e0e0e0;
            --text-sub: #888888;
            --border: #222222;
            --accent: #4caf50;
            --cig-color: #ff9800;
            --save-color: #2196f3;
            --money-color: #ffd700;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f2f2f7;
                --card-bg: #ffffff;
                --input-bg: #ffffff;
                --text-main: #000000;
                --text-sub: #666666;
                --border: #d1d1d6;
                --accent: #34c759;
            }
        }

        html { background-color: var(--bg-color); height: 100%; transition: background 0.3s; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; display: block; -webkit-font-smoothing: antialiased; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; padding: env(safe-area-inset-top, 20px) 15px env(safe-area-inset-bottom, 20px) 15px; box-sizing: border-box; }
        
        h1 { text-align: center; margin: 10px 0 20px 0; font-weight: 700; font-size: 1.8em; }

        /* Dashboard */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: var(--card-bg); border: 1px solid var(--border); padding: 12px; border-radius: 16px; text-align: center; }
        .stat-val { display: block; font-size: 18px; font-weight: 800; color: var(--save-color); }
        .stat-val.money { color: var(--money-color); }
        .stat-lbl { font-size: 10px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; display: block; }

        .inputCard, .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-bottom: 20px; box-sizing: border-box; }
        
        label { display: block; font-size: 14px; color: var(--text-sub); margin-left: 4px; margin-bottom: 4px; }
        input { width: 100%; padding: 12px; margin-top: 4px; margin-bottom: 18px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--accent); }

        button { width: 100%; padding: 14px; background: var(--text-main); color: var(--bg-color); border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
        
        .insight-text { font-size: 14px; color: var(--text-main); line-height: 1.5; margin-bottom: 10px; padding: 10px; background: var(--input-bg); border-radius: 10px; border-left: 4px solid var(--accent); }

        .date { font-size: 13px; color: var(--text-sub); text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
        .total-row { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); font-size: 15px; font-weight: 700; display: flex; flex-direction: column; gap: 6px; }
        .cig-avoided { color: var(--save-color); font-size: 13px; font-weight: 600; }
        .money-saved { color: var(--money-color); font-size: 13px; font-weight: 600; }

        .graphBar { height: 8px; border-radius: 4px; margin-bottom: 10px; width: 100%; background: var(--border); overflow: hidden; }
        .graphFill { background: var(--accent); height: 100%; transition: width 0.4s; }
        .graphLabel { font-size: 10px; color: var(--text-sub); margin-bottom: 2px; display: flex; justify-content: space-between; }

        .deleteBtn { background: transparent; color: #ff3b30; border: 1px solid #ff3b30; margin-top: 15px; font-size: 11px; padding: 4px 10px; width: auto; border-radius: 8px; display: inline-block; opacity: 0.6; }
        .settingsToggleBtn { background: var(--border); color: var(--text-main); margin-top: 20px; margin-bottom: 40px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Vape Tracker</h1>

    <div class="stats-grid">
        <div class="stat-box"><span id="stat-today" class="stat-val">0</span><span class="stat-lbl">Today (Cigs)</span></div>
        <div id="money-box" class="stat-box"><span id="stat-money" class="stat-val money">0</span><span class="stat-lbl">Saved (PLN)</span></div>
        <div class="stat-box"><span id="stat-week" class="stat-val">0</span><span class="stat-lbl">7d Avoided</span></div>
        <div class="stat-box"><span id="stat-total" class="stat-val">0</span><span class="stat-lbl">Lifetime Cigs</span></div>
    </div>

    <div class="inputCard" id="mainInputCard">
        <div id="morningContainer">
            <label for="morning">Morning Counter</label>
            <input id="morning" type="number" placeholder="Enter morning value">
        </div>
        <div id="eveningContainer" style="display:none;">
            <label for="evening">Evening Counter</label>
            <input id="evening" type="number" placeholder="Enter evening value">
        </div>
        <div id="completeMsg" style="display:none; text-align: center; color: var(--accent); font-weight: 700; padding: 10px 0;">
            Day Logged! 🎉
            <button id="resetTodayBtn" style="background: var(--border); color: var(--text-main); margin-top: 10px; font-size: 12px; padding: 6px; width: 100%;">Edit Today's Data</button>
        </div>
        <button id="saveBtn">Save Entry</button>
    </div>

    <div class="card" id="insightsCard" style="display:none;">
        <div class="date" style="color: var(--accent);">Weekly Insights</div>
        <div id="insightsList"></div>
    </div>

    <div id="entries"></div>

    <div class="inputCard">
        <div class="graphLabel"><span>Puff Trend (Last 7 Logs)</span></div>
        <div id="graph"></div>
    </div>

    <button id="toggleSettings" class="settingsToggleBtn">Settings & Data</button>

    <div id="settingsArea" style="display:none;">
        <div class="inputCard">
            <h3>Configuration</h3>
            <label for="juiceStrength">Juice Strength (mg/ml)</label>
            <input id="juiceStrength" type="number" step="0.1">
            <label for="deviceMax">Device Max (Rollover)</label>
            <input id="deviceMax" type="number">
            <label for="oldHabit">Cigarettes per Day (Old Habit)</label>
            <input id="oldHabit" type="number">
            <label for="packPrice">Price per Pack (PLN)</label>
            <input id="packPrice" type="number" step="0.01">
            <label for="nicPerCig">Nicotine per Cig (mg)</label>
            <input id="nicPerCig" type="number" step="0.1">
        </div>

        <div class="inputCard">
            <h3>Management</h3>
            <button id="exportJsonBtn" style="margin-bottom: 10px; background: var(--border);">Backup JSON</button>
            <input type="file" id="restoreFile" accept=".json" style="display:none;">
            <button id="restoreBtn" style="background: transparent; border: 1px solid var(--border); color: var(--text-sub);">Restore JSON</button>
        </div>
    </div>
</div>

<script>
(() => {
    const AVG_PUFF_ML = 0.005; 
    let entries = [];

    const DOM = {
        juiceStrength: document.getElementById("juiceStrength"),
        deviceMax: document.getElementById("deviceMax"),
        oldHabit: document.getElementById("oldHabit"),
        packPrice: document.getElementById("packPrice"),
        nicPerCig: document.getElementById("nicPerCig"),
        morning: document.getElementById("morning"),
        evening: document.getElementById("evening"),
        morningContainer: document.getElementById("morningContainer"),
        eveningContainer: document.getElementById("eveningContainer"),
        completeMsg: document.getElementById("completeMsg"),
        resetTodayBtn: document.getElementById("resetTodayBtn"),
        entries: document.getElementById("entries"),
        graph: document.getElementById("graph"),
        saveBtn: document.getElementById("saveBtn"),
        statToday: document.getElementById("stat-today"),
        statMoney: document.getElementById("stat-money"),
        statWeek: document.getElementById("stat-week"),
        statTotal: document.getElementById("stat-total"),
        insightsCard: document.getElementById("insightsCard"),
        insightsList: document.getElementById("insightsList"),
        settingsArea: document.getElementById("settingsArea"),
        toggleSettings: document.getElementById("toggleSettings"),
        exportJsonBtn: document.getElementById("exportJsonBtn"),
        restoreFile: document.getElementById("restoreFile"),
        restoreBtn: document.getElementById("restoreBtn")
    };

    function getLogicalDate() {
        const now = new Date();
        if (now.getHours() < 4) now.setDate(now.getDate() - 1);
        return now.toISOString().split("T")[0];
    }

    function loadData() {
        const stored = JSON.parse(localStorage.getItem("vapeEntries") || "[]");
        entries = Array.isArray(stored) ? stored : [];
        entries.sort((a, b) => b.date.localeCompare(a.date));
        
        DOM.juiceStrength.value = localStorage.getItem("cfg_strength") || "20";
        DOM.deviceMax.value = localStorage.getItem("cfg_deviceMax") || "9999";
        DOM.oldHabit.value = localStorage.getItem("cfg_oldHabit") || "20";
        DOM.packPrice.value = localStorage.getItem("cfg_packPrice") || "24.99";
        DOM.nicPerCig.value = localStorage.getItem("cfg_nicPerCig") || "1.0";
        
        updateUI();
    }

    function generateInsights() {
        const active = entries.filter(e => e.puffs !== undefined);
        if (active.length < 2) { DOM.insightsCard.style.display = "none"; return; }
        DOM.insightsCard.style.display = "block";
        DOM.insightsList.innerHTML = "";
        
        const last7 = active.slice(0, 7);
        const avgPuffs = last7.reduce((s, e) => s + (e.puffs || 0), 0) / last7.length;
        const insight = document.createElement("div");
        insight.className = "insight-text";
        insight.innerHTML = `7-day avg: <b>${Math.round(avgPuffs)}</b> puffs. `;
        
        if (active[0].puffs < avgPuffs) insight.innerHTML += "You're under average today! 🚭";
        else insight.innerHTML += "Today is above your average.";
        
        DOM.insightsList.appendChild(insight);
    }

    function updateUI() {
        DOM.entries.innerHTML = "";
        const nicCig = parseFloat(DOM.nicPerCig.value) || 1.0;
        const oldHabitCount = parseFloat(DOM.oldHabit.value) || 20;
        const pricePerPack = parseFloat(DOM.packPrice.value) || 24.99;
        const logDate = getLogicalDate();
        const todaysEntry = entries.find(e => e.date === logDate);

        let totalSavedCigs = 0, weekSavedCigs = 0, todaySavedCigs = 0;

        entries.forEach((e, idx) => {
            const cigEquiv = (e.nicotine || 0) / nicCig;
            const saved = Math.max(0, oldHabitCount - cigEquiv);
            const savedCash = (saved / 20) * pricePerPack;
            
            totalSavedCigs += saved;
            if (idx < 7) weekSavedCigs += saved;
            if (e.date === logDate) todaySavedCigs = saved;

            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <div class="date">${new Date(e.date).toLocaleDateString(undefined, {weekday:'short', day:'numeric'})}</div>
                <div class="total-row">
                    <span style="color:var(--accent)">${e.puffs || 0} Puffs</span>
                    <span class="cig-avoided">💪 ${saved.toFixed(1)} Cigs Avoided</span>
                    <span class="money-saved">💰 Saved ${savedCash.toFixed(2)} PLN</span>
                </div>
            `;
            const del = document.createElement("button");
            del.className = "deleteBtn"; del.textContent = "Delete";
            del.onclick = () => { if(confirm("Delete record?")) { entries=entries.filter(x=>x.date!==e.date); saveData(); updateUI(); } };
            card.appendChild(del);
            DOM.entries.appendChild(card);
        });

        // Dashboard totals
        const lifetimeCash = (totalSavedCigs / 20) * pricePerPack;
        DOM.statToday.textContent = todaySavedCigs.toFixed(1);
        DOM.statMoney.textContent = lifetimeCash.toFixed(0);
        DOM.statWeek.textContent = weekSavedCigs.toFixed(0);
        DOM.statTotal.textContent = totalSavedCigs.toFixed(0);

        // Input Toggle
        if (!todaysEntry) {
            DOM.morningContainer.style.display = "block"; DOM.eveningContainer.style.display = "none"; DOM.completeMsg.style.display = "none"; DOM.saveBtn.style.display = "block";
        } else if (todaysEntry.evening === undefined) {
            DOM.morningContainer.style.display = "none"; DOM.eveningContainer.style.display = "block"; DOM.completeMsg.style.display = "none"; DOM.saveBtn.style.display = "block";
        } else {
            DOM.morningContainer.style.display = "none"; DOM.eveningContainer.style.display = "none"; DOM.completeMsg.style.display = "block"; DOM.saveBtn.style.display = "none";
        }

        // Graph
        DOM.graph.innerHTML = "";
        const trendData = entries.filter(e => e.puffs !== undefined).slice(0, 7).reverse();
        const max = Math.max(...trendData.map(e => e.puffs || 0), 100);
        trendData.forEach(e => {
            const pct = Math.min(((e.puffs || 0) / max) * 100, 100);
            DOM.graph.innerHTML += `<div class="graphLabel"><span>${e.date.split('-')[2]}</span><span>${e.puffs || 0}</span></div><div class="graphBar"><div class="graphFill" style="width:${pct}%"></div></div>`;
        });

        generateInsights();
    }

    function saveData() {
        localStorage.setItem("vapeEntries", JSON.stringify(entries));
        localStorage.setItem("cfg_strength", DOM.juiceStrength.value);
        localStorage.setItem("cfg_deviceMax", DOM.deviceMax.value);
        localStorage.setItem("cfg_oldHabit", DOM.oldHabit.value);
        localStorage.setItem("cfg_packPrice", DOM.packPrice.value);
        localStorage.setItem("cfg_nicPerCig", DOM.nicPerCig.value);
    }

    DOM.saveBtn.addEventListener("click", () => {
        const strength = parseFloat(DOM.juiceStrength.value) || 20;
        const dMax = parseInt(DOM.deviceMax.value) || 9999;
        const morningVal = parseInt(DOM.morning.value);
        const eveningVal = parseInt(DOM.evening.value);
        const logDate = getLogicalDate();

        let e = entries.find(x => x.date === logDate);
        if (!e) { e = { date: logDate }; entries.unshift(e); }
        if (!isNaN(morningVal)) e.morning = morningVal;
        if (!isNaN(eveningVal)) e.evening = eveningVal;
        if (e.morning !== undefined && e.evening !== undefined) {
            e.puffs = (e.evening < e.morning) ? (dMax - e.morning) + e.evening : e.evening - e.morning;
            e.nicotine = +(e.puffs * strength * AVG_PUFF_ML).toFixed(2);
        }
        saveData(); updateUI();
        DOM.morning.value = ""; DOM.evening.value = "";
    });

    DOM.toggleSettings.addEventListener("click", () => {
        const show = DOM.settingsArea.style.display === "none";
        DOM.settingsArea.style.display = show ? "block" : "none";
        DOM.toggleSettings.textContent = show ? "Close Settings" : "Settings & Data";
    });

    DOM.resetTodayBtn.addEventListener("click", () => {
        const logDate = getLogicalDate();
        const e = entries.find(x => x.date === logDate);
        if (e) {
            DOM.morning.value = e.morning; DOM.evening.value = e.evening || "";
            DOM.completeMsg.style.display = "none"; DOM.morningContainer.style.display = "block"; DOM.eveningContainer.style.display = "block"; DOM.saveBtn.style.display = "block";
        }
    });

    DOM.exportJsonBtn.addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries));
        a.download = "vape_backup.json"; a.click();
    });

    DOM.restoreBtn.addEventListener("click", () => DOM.restoreFile.click());
    DOM.restoreFile.addEventListener("change", (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => { entries = JSON.parse(ev.target.result); saveData(); updateUI(); alert("Data Restored!"); };
        reader.readAsText(e.target.files[0]);
    });

    loadData();
})();
</script>
</body>
</html>
