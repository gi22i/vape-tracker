<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vape Tracker Advanced</title>
<style>
  body {
    margin: 0;
    padding-top: env(safe-area-inset-top, 20px);
    padding-bottom: env(safe-area-inset-bottom, 20px);
    padding-left: env(safe-area-inset-left, 0);
    padding-right: env(safe-area-inset-right, 0);
    background: #000;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 600px;
    padding: 0 10px;
    min-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  }
  
  h1 { text-align: center; margin-bottom: 20px; font-weight: 600; font-size: 1.8em; }
  
  .inputCard, .card {
    background: #1a1a1a;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    width: 100%;
    box-sizing: border-box;
  }
  input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    margin-bottom: 12px;
    background: #000;
    border: 1px solid #333;
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #333;
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    margin-top: 6px;
    cursor: pointer;
  }
  button:active { background: #555; }
  
  .card.incomplete { opacity: 0.7; }
  .date { font-size: 16px; color: #aaa; margin-bottom: 6px; }
  .row { display: flex; justify-content: space-between; margin: 4px 0; }
  .label { color: #888; }
  .value { font-weight: 600; }
  .time { color: #888; font-size: 12px; margin-left: 6px; }
  .total { margin-top: 10px; font-size: 16px; font-weight: 700; color: #fff; }
  
  .graphBar { height: 14px; border-radius: 7px; margin-bottom: 6px; width: 100%; background: #222; overflow: hidden; }
  .graphFill { background: #4caf50; height: 100%; border-radius: 7px; transition: width 0.3s ease; }
  .graphLabel { font-size: 12px; color: #aaa; margin-bottom: 2px; text-align: left; display: flex; justify-content: space-between;}
  
  .progressBarContainer { background: #333; border-radius: 10px; overflow: hidden; margin-top: 6px; width: 100%; }
  .progressBar { height: 14px; background: #ff5722; width: 0%; transition: width 0.3s ease; }
  
  .deleteBtn { background: #880000; margin-top: 12px; }
  .deleteBtn:active { background: #a00000; }
</style>
</head>
<body>
<div class="container">

  <h1>Vape Tracker Advanced</h1>
  
  <div class="inputCard">
    <label for="juiceStrength">Juice Strength (mg/ml)</label>
    <input id="juiceStrength" type="number" step="0.1" value="20">
    
    <label for="dailyGoal">Daily Goal (puffs per day)</label>
    <input id="dailyGoal" type="number" value="300">
    
    <label for="morning">Morning Counter</label>
    <input id="morning" type="number">
    
    <div id="eveningContainer" style="display:none;">
      <label for="evening">Evening Counter</label>
      <input id="evening" type="number">
    </div>
    
    <button id="saveBtn">Save Entry</button>
  </div>
  
  <div id="entries"></div>
  
  <div class="inputCard">
    <h3>Last 7 Days Puff Graph</h3>
    <div id="graph"></div>
  </div>
  
  <div class="inputCard">
    <h3>Weekly Summary</h3>
    <div id="weeklySummary"></div>
  </div>
  
  <div class="inputCard">
    <h3>Historical Insights</h3>
    <div id="insights"></div>
  </div>
  
  <div class="inputCard">
    <button id="exportJsonBtn">Backup / Export JSON</button>
    <button id="exportCsvBtn">Export CSV</button>
    <input type="file" id="restoreFile" accept=".json" style="display:none;">
    <button id="restoreBtn">Restore JSON</button>
  </div>

</div>

<script>
// IIFE to prevent global scope pollution
(() => {
  const AVG_PUFF_ML = 0.05;
  const VAPE_COUNTER_MAX = 9999; // Change this if your device goes to 99999
  let entries = [];

  // DOM Elements cache
  const DOM = {
    juiceStrength: document.getElementById("juiceStrength"),
    dailyGoal: document.getElementById("dailyGoal"),
    morning: document.getElementById("morning"),
    evening: document.getElementById("evening"),
    eveningContainer: document.getElementById("eveningContainer"),
    entries: document.getElementById("entries"),
    graph: document.getElementById("graph"),
    weeklySummary: document.getElementById("weeklySummary"),
    insights: document.getElementById("insights"),
    saveBtn: document.getElementById("saveBtn"),
    exportJsonBtn: document.getElementById("exportJsonBtn"),
    exportCsvBtn: document.getElementById("exportCsvBtn"),
    restoreFile: document.getElementById("restoreFile"),
    restoreBtn: document.getElementById("restoreBtn")
  };

  // --- DATA LAYER ---
  function loadData() {
    try {
      const stored = JSON.parse(localStorage.getItem("vapeEntries") || "[]");
      entries = Array.isArray(stored) ? stored : [];
      entries.sort((a, b) => b.date.localeCompare(a.date));
    } catch (e) {
      console.error("Failed to load data", e);
      entries = [];
    }
    updateUI();
  }

  function saveData() {
    localStorage.setItem("vapeEntries", JSON.stringify(entries));
  }

  // --- LOGIC LAYER ---
  function formatTime() { 
    return new Date().toTimeString().split(' ')[0].slice(0, 5); 
  }

  function handleSaveEntry() {
    const juiceStrength = parseFloat(DOM.juiceStrength.value) || 20;
    const dailyGoal = parseInt(DOM.dailyGoal.value) || 300;
    const morningVal = parseInt(DOM.morning.value);
    const eveningVal = parseInt(DOM.evening.value);
    const today = new Date().toISOString().split("T")[0];

    if (isNaN(morningVal) && isNaN(eveningVal)) {
      alert("Please enter a morning or evening counter value.");
      return;
    }

    let existing = entries.find(e => e.date === today);
    
    // Create new entry if it doesn't exist today
    if (!existing) {
      existing = { date: today, goal: dailyGoal, juiceStrength: juiceStrength };
      entries.unshift(existing);
    }

    // Update values if provided
    if (!isNaN(morningVal)) {
      existing.morning = morningVal;
      existing.morningTime = formatTime();
    }
    if (!isNaN(eveningVal)) {
      existing.evening = eveningVal;
      existing.eveningTime = formatTime();
    }

    // Calculate puffs (with Rollover Protection)
    if (existing.morning !== undefined && existing.evening !== undefined) {
      if (existing.evening < existing.morning) {
        existing.puffs = (VAPE_COUNTER_MAX - existing.morning) + existing.evening;
      } else {
        existing.puffs = existing.evening - existing.morning;
      }
    } else {
      existing.puffs = 0;
    }

    // Update nicotine and strength based on current calculation
    existing.juiceStrength = juiceStrength;
    existing.nicotine = +(existing.puffs * juiceStrength * AVG_PUFF_ML).toFixed(2);
    existing.goal = dailyGoal;

    saveData();
    updateUI();
    
    // Clear inputs
    DOM.morning.value = "";
    DOM.evening.value = "";
  }

  function deleteEntry(date) {
    if (confirm("Are you sure you want to delete this entry?")) {
      entries = entries.filter(e => e.date !== date);
      saveData();
      updateUI();
    }
  }

  // --- UI LAYER ---
  function updateUI() {
    renderEntries();
    renderGraph();
    renderWeeklySummary();
    renderInsights();
    
    // Manage evening input visibility based on today's morning data
    const today = new Date().toISOString().split("T")[0];
    const todaysEntry = entries.find(e => e.date === today);
    DOM.eveningContainer.style.display = todaysEntry?.morning !== undefined ? "block" : "none";
  }

  function renderEntries() {
    DOM.entries.innerHTML = "";
    entries.forEach(e => {
      const card = document.createElement("div");
      card.className = "card";
      if (e.morning === undefined || e.evening === undefined) card.classList.add("incomplete");
      
      // Building innerHTML with sanitized numbers/strings
      card.innerHTML = `
        <div class="date">${e.date}</div>
        <div class="row">
          <div class="label">Morning</div>
          <div class="value">${e.morning ?? "-"} <span class="time">${e.morningTime || ""}</span></div>
        </div>
        <div class="row">
          <div class="label">Evening</div>
          <div class="value">${e.evening ?? "-"} <span class="time">${e.eveningTime || ""}</span></div>
        </div>
        <div class="total">Total Puffs: ${e.puffs || 0} | Nicotine: ${e.nicotine || 0} mg</div>
      `;
      
      const delBtn = document.createElement("button");
      delBtn.className = "deleteBtn";
      delBtn.textContent = "Delete Entry";
      delBtn.onclick = () => deleteEntry(e.date);
      card.appendChild(delBtn);

      DOM.entries.appendChild(card);
    });
  }

  function renderGraph() {
    DOM.graph.innerHTML = "";
    const last7 = entries.slice(0, 7).reverse();
    if (last7.length === 0) return;

    const maxPuffs = Math.max(...last7.map(e => e.puffs || 0), 1);
    
    last7.forEach(e => {
      const label = document.createElement("div");
      label.className = "graphLabel";
      label.innerHTML = `<span>${e.date}</span> <span>${e.puffs || 0} puffs</span>`;
      
      const bar = document.createElement("div");
      bar.className = "graphBar";
      
      const pct = Math.min(((e.puffs || 0) / maxPuffs) * 100, 100);
      bar.innerHTML = `<div class="graphFill" style="width: ${pct}%"></div>`;
      
      DOM.graph.appendChild(label);
      DOM.graph.appendChild(bar);
    });
  }

  function renderWeeklySummary() {
    const weekly = entries.slice(0, 7);
    if (!weekly.length) {
      DOM.weeklySummary.innerHTML = "Not enough data.";
      return;
    }

    const totalPuffs = weekly.reduce((acc, e) => acc + (e.puffs || 0), 0);
    const avgPuffs = Math.round(totalPuffs / weekly.length);
    const goal = weekly[0].goal || 300; 
    const progress = Math.min(100, (avgPuffs / goal) * 100);
    
    // Determine color based on goal progress
    let barColor = "#4caf50"; // Green if under goal
    if (progress > 85) barColor = "#ff9800"; // Orange if close
    if (progress >= 100) barColor = "#f44336"; // Red if over

    DOM.weeklySummary.innerHTML = `
      <div class="row"><div class="label">Total Puffs (Past 7 Days):</div><div class="value">${totalPuffs}</div></div>
      <div class="row"><div class="label">Average Puffs / Day:</div><div class="value">${avgPuffs}</div></div>
      <div class="row" style="margin-top:12px;"><div class="label">Goal Limit (${goal} puffs):</div></div>
      <div class="progressBarContainer">
        <div class="progressBar" style="width:${progress}%; background:${barColor};"></div>
      </div>
    `;
  }

  function renderInsights() {
    if (!entries.length) { 
      DOM.insights.innerHTML = "No data yet."; 
      return; 
    }
    
    const validEntries = entries.filter(e => e.puffs > 0);
    if (!validEntries.length) {
      DOM.insights.innerHTML = "Not enough completed entries to generate insights.";
      return;
    }

    const totalVals = validEntries.map(e => e.puffs);
    const highest = Math.max(...totalVals);
    const lowest = Math.min(...totalVals);
    
    DOM.insights.innerHTML = `
      <div class="row"><div class="label">Highest Puffs / Day:</div><div class="value">${highest}</div></div>
      <div class="row"><div class="label">Lowest Puffs / Day:</div><div class="value">${lowest}</div></div>
      <div class="row"><div class="label">Total Tracked Days:</div><div class="value">${entries.length}</div></div>
    `;
  }

  // --- EXPORT / RESTORE ---
  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries));
    const dlAnchor = document.createElement("a");
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", "vapeEntries.json");
    dlAnchor.click();
  }

  function exportCSV() {
    let csv = "Date,MorningCounter,EveningCounter,Puffs,Nicotine_mg,JuiceStrength_mg,DailyGoal\n";
    entries.forEach(e => {
      // Safely handle missing historical strengths by falling back to the current input
      const strength = e.juiceStrength || DOM.juiceStrength.value;
      csv += `${e.date},${e.morning ?? ""},${e.evening ?? ""},${e.puffs || 0},${e.nicotine || 0},${strength},${e.goal || ""}\n`;
    });
    
    const dlAnchor = document.createElement("a");
    dlAnchor.setAttribute("href", "data:text/csv;charset=utf-8," + encodeURIComponent(csv));
    dlAnchor.setAttribute("download", "vapeEntries.csv");
    dlAnchor.click();
  }

  function handleRestore(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const imported = JSON.parse(event.target.result);
        if (Array.isArray(imported)) {
          entries = imported;
          saveData();
          updateUI();
          alert("Data restored successfully!");
        } else {
          alert("Invalid JSON format. Expected an array of entries.");
        }
      } catch {
        alert("Error reading JSON file.");
      }
      DOM.restoreFile.value = ""; // Reset input so same file can be loaded again if needed
    };
    reader.readAsText(file);
  }

  // --- EVENT LISTENERS ---
  DOM.saveBtn.addEventListener("click", handleSaveEntry);
  DOM.exportJsonBtn.addEventListener("click", exportData);
  DOM.exportCsvBtn.addEventListener("click", exportCSV);
  DOM.restoreBtn.addEventListener("click", () => DOM.restoreFile.click());
  DOM.restoreFile.addEventListener("change", handleRestore);

  // Initialization
  document.addEventListener("DOMContentLoaded", loadData);

})();
</script>
</body>
</html>
